events {
    worker_connections 1024;
}

http {
    upstream nodejs-backend {
        server nodejs-app:3000;
    }

    upstream python-backend {
        server python-app:5000;
    }

    upstream nginx-backend {
        server nginx-custom:80;
    }

    server {
        listen 80;
        
        # Health check endpoint
        location /health {
            return 200 '{"status":"OK","load_balancer":"nginx","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # Route to Node.js app
        location /api/node/ {
            proxy_pass http://nodejs-backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route to Python app
        location /api/python/ {
            proxy_pass http://python-backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route to custom nginx (static content)
        location / {
            proxy_pass http://nginx-backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}