version: "3.8"

services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    networks:
      - webnet

networks:
  webnet:
    driver: overlay
